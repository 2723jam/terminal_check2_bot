name: terminal_check2_bot

on:
  schedule:
    # Asia/Seoul 09:05-18:05 == UTC 00:05-09:05
    - cron: "5 0-9 * * *"
  workflow_dispatch:

concurrency:
  group: terminal_check2_bot
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BOT_NAME: terminal_check2_bot
      TELEGRAM_BOT_TOKEN: ${{ secrets.TERMINAL_CHECK2_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TERMINAL_CHECK2_TELEGRAM_CHAT_ID }}
      PORTS_CONFIG: config/ports.yaml
      KEYWORDS_CONFIG: config/keywords.yaml
      STATE_FILE: data/terminal_check2_bot_state.json
      TIMEZONE: Asia/Seoul
      SEND_EMPTY_REPORT: ${{ vars.TERMINAL_CHECK2_SEND_EMPTY_REPORT || 'false' }}
      SEND_UNCHANGED_ALERTS: ${{ vars.TERMINAL_CHECK2_SEND_UNCHANGED_ALERTS || 'false' }}
      HTTP_TIMEOUT_SECONDS: "20"
      HTTP_USER_AGENT: "terminal_check2_bot/1.0 (+official-port-notice-monitor)"
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: data
          key: terminal-check2-bot-state-${{ github.run_id }}
          restore-keys: |
            terminal-check2-bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TERMINAL_CHECK2_TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TERMINAL_CHECK2_TELEGRAM_CHAT_ID" && exit 1)

      - name: Check ports and notify Telegram
        run: python -m scripts.run_once
