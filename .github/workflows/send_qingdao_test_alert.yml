name: send_qingdao_test_alert

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  send-test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TERMINAL_CHECK2_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TERMINAL_CHECK2_TELEGRAM_CHAT_ID }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TERMINAL_CHECK2_TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TERMINAL_CHECK2_TELEGRAM_CHAT_ID" && exit 1)

      - name: Send Qingdao historical test alert
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          message = """[테스트/과거 사례]
          ※ QINGDAO
          중단사유 : 기상악화(태풍)
          중단기간 : 22.09.14 14:00 ~ 미정

          출처 : GEODIS Customer Advisory 2022 & 2021 Archives (2022-09-16)
          근거 : Qingdao port and its CFS operation suspended as of 2:00 PM on 14 September 2022 until further notice from the port authority.
          URL : https://geodis.com/customer-advisory-2022-2021-archives"""

          def call_telegram(method, params=None):
              data = urllib.parse.urlencode(params or {}).encode("utf-8") if params else None
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=data,
                  method="POST" if data else "GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", errors="replace")
                  try:
                      description = json.loads(error_body).get("description", error_body)
                  except json.JSONDecodeError:
                      description = error_body
                  return {"ok": False, "http_status": exc.code, "description": description}

          body = call_telegram("sendMessage", {"chat_id": chat_id, "text": message})
          if not body.get("ok") and "chat not found" in body.get("description", "").lower():
              updates = call_telegram("getUpdates")
              latest_chat_id = None
              if updates.get("ok"):
                  for update in reversed(updates.get("result", [])):
                      item = update.get("message") or update.get("channel_post")
                      if item and item.get("chat", {}).get("id"):
                          latest_chat_id = str(item["chat"]["id"])
                          break
              if latest_chat_id:
                  body = call_telegram("sendMessage", {"chat_id": latest_chat_id, "text": message})
              else:
                  print("::error title=Telegram chat not found::Send /start or any message to the bot, then update TERMINAL_CHECK2_TELEGRAM_CHAT_ID with that chat id.")
                  raise SystemExit(1)
          if not body.get("ok"):
              status = body.get("http_status", "unknown")
              print(f"::error title=Telegram API error::HTTP {status} {body.get('description', body)}")
              raise SystemExit(1)
          print("Telegram Qingdao historical test alert sent.")
          PY
